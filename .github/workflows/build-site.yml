name: Build site

# Keeps the blog/projects lists and the shared head/header/footer/titles up to date, and commits the result.
# The markdown converter (page_gen.py) is deliberately NOT run here: run it locally and commit the generated pages.
# Pull requests run the same steps (to check that they work) but don't commit anything.
on:
  push:
    branches: [gh-pages]
    paths:
      - "posts/**"
      - "projects/**"
      - "drafts/**"
      - "*.html"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/build-site.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate blog and projects lists
        run: python scripts/autogenerate_blog_projects.py

      - name: Sync head, header and footer
        run: python scripts/common_header_footer.py

      - name: Set page titles
        run: python scripts/title_script.py

      - name: Format HTML
        run: python scripts/format_html.py

      - name: Commit changes
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Regenerate site pages"
            git pull --rebase
            git push
          fi
