name: Check links

# Fails if a page or markdown file links to an image, video or page that doesn't exist (or that has the wrong
# capitalisation, which works on Windows but breaks on GitHub Pages). It only reads the repository: it never commits.
on:
  push:
    branches: [gh-pages]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # uv installs the Python version in .python-version and the packages pinned in uv.lock
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Check links
        run: uv run python scripts/check_links.py
